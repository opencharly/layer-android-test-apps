android-test-apps:
    candy:
        description: |
            Android apps installed onto a `kind: android` device via the `apk:`
            package format — the declarative counterpart to the `charly check adb
            install-app` probe verb. Carries the F-Droid client (org.fdroid.fdroid)
            as a COMMITTED APK (tests/data/F-Droid.apk — the canonical client from
            f-droid.org, NOT an apkeep download), pushed over the goadb sync
            protocol. A `target: android` deploy applies this layer's `apk:` list
            onto the running device through the external deploy:android substrate
            (candy/plugin-adb installFromHostApk: pure goadb push + pm install — no
            apkeep, no source: — venue-agnostic for the in-pod image device AND a
            remote endpoint). Pair with the `android-apidemos` layer (the same
            committed-APK path) so both fixture anchors share one acquisition story.

            The candy installs NOTHING into the image — the `apk:` list is
            device-scoped, applied ONLY by a `target: android` deploy (skipped at
            image build and on every other target). Its observable effect is
            therefore on the running device: after the deploy, `pm list packages`
            reports org.fdroid.fdroid and the app launches, so the install is
            verifiable end to end over goadb (adb).
        # apk: is the Android app-install package format (parallel to package:/aur:
        # but device-scoped). Each entry is either a `package:` (apkeep download by
        # id — apk-pure/google-play/f-droid/huawei-app-gallery sources) or an `apk:`
        # (committed local file). F-Droid is the canonical sideloadable test app —
        # unlike Chrome it has no static-library dependency, so the committed client
        # APK installs cleanly on the x86_64 emulator. The former apk-pure
        # `package:` download path is GONE: APKPure's Cloudflare bot-wall 403s the
        # apkeep download path (host AND in-pod), while f-droid.org/F-Droid.apk is
        # the canonical 200 source — committed here exactly once.
        apk:
            # Committed local APK (project-root-relative) → goadb push + pm install.
            # No source: — committed files don't use apkeep.
            - apk: tests/data/F-Droid.apk
        plan:
            - check: F-Droid (org.fdroid.fdroid) is installed on the device after a target:android deploy
              adb:
                method: shell
                arg: [pm, list, packages, org.fdroid.fdroid]
              stdout:
                - contains: "org.fdroid.fdroid"
              eventually: 120s
              retry_interval: 5s
              context:
                - runtime
            - check: the installed F-Droid launches and its process is running
              adb:
                method: shell
                arg: [sh, -c, "monkey -p org.fdroid.fdroid -c android.intent.category.LAUNCHER 1 >/dev/null 2>&1; sleep 3; pidof org.fdroid.fdroid"]
              stdout:
                - matches: "[0-9]"
              context:
                - runtime

android-test-apps-skill:
    skill:
        name: android-test-apps
        family: check
        owner: android-test-apps
        description: |-
            The Android test-apps candy — a committed F-Droid APK applied to a
            `kind: android` device through the `apk:` package format. Use when a
            `target: android` deploy must install a test app onto a running emulator
            or device, or when authoring an `apk:` layer list.
        content: |
            # android-test-apps — Android fixture apps via the `apk:` format

            ## Candy Properties

            | Property | Value |
            |----------|-------|
            | Installs into image | nothing (device-scoped) |
            | `apk:` list | `tests/data/F-Droid.apk` (committed) |
            | Applied by | a `target: android` deploy (skipped at image build) |
            | Verified by | `adb:` `pm list packages` / `pidof` after the deploy |

            ## What it does

            Carries the F-Droid client (`org.fdroid.fdroid`) as a **committed APK**
            (`tests/data/F-Droid.apk`), pushed over the goadb sync protocol and
            installed with `pm install`. It is the declarative counterpart to the
            `charly check adb install-app` verb. The candy installs **nothing** into
            the image — the `apk:` list is device-scoped and applied ONLY by a
            `target: android` deploy (via the external `deploy:android` substrate,
            venue-agnostic for an in-pod image device or a remote endpoint).

            ## Usage

            Compose it in the box that backs a `kind: android` deploy:

            ```yaml
            android-fixtures:
              candy:
                base: cachyos-base
                candy:
                  - '@github.com/opencharly/layer-android-test-apps:v2026.xxx.yyyy'
                  - '@github.com/opencharly/layer-android-apidemos:v2026.xxx.yyyy'
            ```

            ## Verification

            The `plan:` `check:` steps run at `context: [runtime]` after a
            `target: android` deploy: `pm list packages` must contain
            `org.fdroid.fdroid`, and launching it (`monkey … LAUNCHER`) must yield a
            running PID — proving the install end to end over `adb`.

            ## Related

            - `/charly-check:android` — the `kind: android` device + `apk:` format
            - `/charly-check:adb` — the `adb:` probe verb
            - `layer-android-apidemos` — the sibling committed-APK fixture
